[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowtrace"
version = "1.0.0"
description = "SHADOWTRACE - detect attackers by behavior, not IP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SHADOWTRACE" }]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "networkx>=3.2",
  "sqlite-utils>=3.36",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
capture = ["scapy>=2.5.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
shadowtrace = "shadowtrace.cli:app"
shadowtrace_gui = "shadowtrace.gui_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shadowtrace*"]

[tool.setuptools.package-data]
shadowtrace = ["gui/static/*", "gui/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
